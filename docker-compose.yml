
services:
  mongodb:
    image: mongo:7
    container_name: taskmanager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume keeps data across `docker compose down` / container restarts
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      # Compose waits for this to report healthy before starting the backend
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: task-manager-api/Dockerfile
    container_name: taskmanager-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        
        condition: service_healthy
    environment:
      
      MONGO_URI: mongodb://mongodb:27017/task_management
      MONGODB_URI: mongodb://mongodb:27017/task_management
      PORT: "5000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      NODE_ENV: production
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      NOTIFICATION_DELAY_MS: ${NOTIFICATION_DELAY_MS:-2000}
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: taskmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge